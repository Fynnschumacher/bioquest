<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#244e57"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="BIOQUEST"><title>BIOQUEST</title><style>*{box-sizing:border-box}body{margin:0;background:#17323d;color:#fff7df;font:16px system-ui}button,input{font:inherit}button{cursor:pointer;background:#ffe1a0;border:3px solid #8e5c39;border-radius:12px;padding:12px;color:#352922}button:active{transform:scale(.98)}.app{max-width:950px;margin:auto;padding:15px}.box{background:#28525a;border:3px solid #cba978;border-radius:20px;padding:18px;margin:15px 0}header,.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}header{justify-content:space-between}.map{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:25px 10px;min-height:450px;align-content:space-around;border:8px solid #ba945a;border-radius:42%;background:radial-gradient(ellipse,#9dcb79 0 51%,#4294a9 52% 75%,#21687c 76%)}.map button{min-height:110px;background:#fff0c4e8}.emoji{display:block;font-size:36px}.rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.room{background:#9c775c;border:6px solid #503f3c;border-radius:9px;min-height:140px;display:grid;place-content:center;text-align:center}.room:nth-child(even){background:#6e9184}.room:last-child{grid-column:span 2}.card{background:#376570;border:2px solid #b99a72;border-radius:12px;padding:13px;margin:10px 0}input{padding:12px;border-radius:8px;max-width:100%}h1,h2{margin:.3em 0 .7em}.gold{color:#ffe28d;font-weight:bold}.muted{opacity:.8}footer{text-align:center;opacity:.6;padding:12px;font-size:12px}@media(max-width:500px){.map{min-height:450px;gap:7px;padding:12px 5px}.map button{font-size:13px;padding:6px;min-height:100px}.emoji{font-size:30px}}.map{position:relative;grid-template-columns:repeat(3,1fr);border:8px solid #a9d5dc;border-radius:32px;overflow:hidden;background:radial-gradient(ellipse at 50% 54%,#85c56c 0 39%,#468c57 40% 47%,transparent 48%),radial-gradient(ellipse at 50% 55%,#4aaac4 0 65%,#196784 66% 100%);box-shadow:inset 0 0 0 6px #d4b876,0 12px 30px #071e28;min-height:530px;align-content:space-between;padding:42px 15px}.map:before{content:"🌲 🌳 🌸 🌲 🌳 🌲 🌸 🌲 🌳";position:absolute;top:43%;left:8%;right:8%;font-size:25px;text-align:center;letter-spacing:9px;pointer-events:none;opacity:.8}.map button{position:relative;z-index:1;min-height:132px;background:linear-gradient(#fff4d4ed,#e9d3a8e8);border:4px solid #93613d;box-shadow:0 7px 0 #6d5637,0 10px 16px #193f40;border-radius:18px;font-weight:700}.map button .emoji{font-size:57px;filter:drop-shadow(2px 5px 2px #62503b)}.map button:hover,.map button:focus{outline:4px solid #ffec91;transform:translateY(-2px)}.map button:nth-child(2),.map button:nth-child(5){transform:translateY(30px)}.map button:nth-child(2):active,.map button:nth-child(5):active{transform:translateY(32px)}.box{background:linear-gradient(160deg,#315b61,#20444f)}.room{box-shadow:inset 0 0 24px #392b2880}.card{box-shadow:0 3px 8px #0a25354a}@media(max-width:500px){.map{min-height:450px;padding:35px 5px}.map button{min-height:110px}.map button .emoji{font-size:38px}}</style></head><body><div class="app" id="app"></div><script>
const D={gold:50,name:'',element:'Feuer',owned:['Altes Bett'],bed:'Altes Bett',worlds:[],topic:'',q:0,correct:0,errors:[],room:'',page:'spawn'};let s;try{s={...D,...JSON.parse(localStorage.getItem('bioquest-save')||'{}')}}catch(e){s={...D}}const save=()=>localStorage.setItem('bioquest-save',JSON.stringify(s)),go=p=>{s.page=p;save();render()},b=(t,a)=>'<button onclick="'+a+'">'+t+'</button>',back=()=>b('← Zurück',s.page==='room'?'go("home")':s.page==='mission'?'go("portal")':'go("spawn")'),safe=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const qs=[['Wo beginnt die Verdauung?',['Im Mund','Im Dünndarm','In der Leber'],0,'Zähne zerkleinern Nahrung; Speichel startet die chemische Verdauung.'],['Was transportiert Nahrung zum Magen?',['Luftröhre','Speiseröhre','Dickdarm'],1,'Die Speiseröhre bewegt Nahrung mit Muskelkontraktionen.'],['Wo werden die meisten Nährstoffe aufgenommen?',['Dünndarm','Magen','Mund'],0,'Dünndarmzotten vergrößern die Aufnahmeoberfläche.'],['Was macht die Galle?',['Sie verteilt Fett in kleine Tröpfchen','Sie erzeugt Sauerstoff','Sie baut Knochen auf'],0,'Galle emulgiert Fette und unterstützt so die Verdauung.'],['Was entzieht der Dickdarm dem Speisebrei?',['Wasser','Licht','Sauerstoff'],0,'Der Dickdarm nimmt Wasser und Elektrolyte auf.'],['Boss: Welche Reihenfolge stimmt?',['Mund → Magen → Dünndarm → Dickdarm','Magen → Mund → Dickdarm','Dickdarm → Magen → Mund'],0,'Die Nahrung gelangt vom Mund über die Speiseröhre zum Magen und dann durch die Därme.']];let feedback='';
function answer(i){const q=qs[s.q],ok=i===q[2];if(ok){s.gold+=5;s.correct++}else s.errors.push(q[0]);feedback=(ok?'✨ Richtig! +5 Gold. ':'Noch nicht richtig. ')+q[3];s.q++;save();render()}
function render(){let x='<header><h1>🌿 BIOQUEST</h1><span class="gold">🪙 '+s.gold+' Gold</span></header>';
if(s.page==='spawn')x+='<div class="box"><h2>Die Insel des Wissens</h2><p>Tippe auf ein Gebäude, um es zu besuchen.</p><div class="map">'+[['🏚️','Mein Zuhause','home'],['🛍️','Marktplatz','market'],['🥚','Ei-Shop','eggs'],['🌀','Missionsportal','portal'],['📚','Bibliothek','library'],['🧙','Zwergenhütte','dwarf']].map(a=>b('<span class="emoji">'+a[0]+'</span>'+a[1],'go("'+a[2]+'")')).join('')+'</div></div>';
if(s.page==='home')x+='<div class="box"><h2>🏚️ Mein Zuhause – Puppenhaus</h2><p>Wähle ein Zimmer für die Detailansicht.</p><div class="rooms">'+[['🛏️','Schlafzimmer'],['🍳','Küche'],['🛋️','Wohnzimmer'],['🛁','Badezimmer'],['🧙','Begleiterzimmer']].map(a=>'<div class="room"><div style="font-size:36px">'+a[0]+'</div>'+b(a[1],'room("'+a[1]+'")')+'</div>').join('')+'</div></div>'+back();
if(s.page==='room'){x+='<div class="box"><h2>🏠 '+safe(s.room)+'</h2><div style="font-size:90px;text-align:center;padding:24px">'+({Schlafzimmer:'🛏️',Küche:'🍳',Wohnzimmer:'🛋️',Badezimmer:'🛁',Begleiterzimmer:'🧙'}[s.room])+'</div>';if(s.room==='Schlafzimmer')x+='<div class="card"><h3>Dein Bett: '+safe(s.bed)+'</h3>'+s.owned.filter(a=>a.includes('Bett')).map(a=>b(safe(a),'bed("'+a+'")')).join(' ')+'</div>';if(s.room==='Wohnzimmer')x+='<div class="card"><h3>📋 Auftragswand</h3><p>Trainiere Verdauung und verdiene Gold.</p>'+b('Zum Portal','go("portal")')+'</div>';x+='</div>'+back()}
if(s.page==='market')x+='<div class="box"><h2>🛍️ Marktplatz</h2>'+[['Gemütliches Bett',30],['Königliches Bett',100],['Zauberlampe',25]].map(a=>'<div class="card">'+a[0]+' – '+a[1]+' Gold '+b(s.owned.includes(a[0])?'Gekauft':'Kaufen','buy("'+a[0]+'",'+a[1]+')')+'</div>').join('')+'</div>'+back();
if(s.page==='eggs')x+='<div class="box"><h2>🥚 Ei-Shop</h2><p>🧝 Elfenei – 1000 Gold (geplant: 35 %)</p><p>🐉 Drachenei – 3000 Gold (geplant: 25 %)</p><p class="muted">Begleiter aus Eiern kommen in einer späteren Version.</p></div>'+back();
if(s.page==='dwarf')x+='<div class="box"><h2>🧙 Dein Elementarmagier</h2><div class="row">'+['Feuer','Wasser','Erde','Luft'].map(a=>b(({Feuer:'🔥',Wasser:'💧',Erde:'🌱',Luft:'🌬️'}[a])+' '+a,'element("'+a+'")')).join('')+'</div><p>Gewählt: '+safe(s.element)+'</p><input id="nm" placeholder="Name des Zwergs" value="'+safe(s.name)+'"> '+b('Namen speichern','nameDwarf()')+'<p class="muted">Freies KI-Tutoring ist noch nicht integriert.</p></div>'+back();
if(s.page==='portal')x+='<div class="box"><h2>🌀 Missionsportal</h2><p>✨ Das Portal zieht dich hinein!</p><p>🧙 '+safe(s.name||'Dein Zwerg')+': „Möchtest du ein altes oder neues Thema bearbeiten?“</p><div class="row">'+b('Altes Thema','go("old")')+b('Neues Thema','go("new")')+'</div></div>'+back();
if(s.page==='old')x+='<div class="box"><h2>Gespeicherte Welten</h2>'+(s.worlds.length?s.worlds.map((a,i)=>'<div class="card">'+safe(a)+' '+b('Öffnen','startWorld('+i+')')+'</div>').join(''):'<p>Noch keine Welten gespeichert.</p>')+'</div>'+back();
if(s.page==='new')x+='<div class="box"><h2>Neue Lernwelt</h2><p>Gib dein Thema aus Natur und Technik ein.</p><input id="topic" placeholder="z. B. Verdauung"><p class="muted">Für den ersten Test sind nur Verdauungsfragen vorbereitet. Andere Themen können gespeichert werden.</p>'+b('Welt erstellen','newWorld()')+'</div>'+back();
if(s.page==='mission'){const q=qs[s.q];x+='<div class="box"><h2>⚔️ '+safe(s.topic)+'</h2><p>🧙 '+safe(s.name||'Dein Zwerg')+' hilft dir, den Verdauungsdämon zu besiegen.</p>';if(feedback)x+='<div class="card">'+safe(feedback)+'</div>';if(q)x+='<h3>Frage '+(s.q+1)+' / '+qs.length+'</h3><p>'+safe(q[0])+'</p>'+q[1].map((a,i)=>'<div class="card">'+b(safe(a),'answer('+i+')')+'</div>').join('');else x+='<h2>🏆 Boss besiegt!</h2><p>Richtige Antworten: '+s.correct+' von '+qs.length+'</p>'+b('Zur Startinsel','go("spawn")');x+='</div>'+back()}
if(s.page==='library')x+='<div class="box"><h2>📚 Bibliothek</h2><p>Welten: '+(s.worlds.map(safe).join(', ')||'Noch keine')+'</p><h3>Zum Wiederholen</h3><p>'+(s.errors.map(safe).join('<br>')||'Noch keine Fehler gespeichert.')+'</p></div>'+back();
x+='<footer>BIOQUEST · erste spielbare iPad-Testversion · Fortschritt lokal gespeichert</footer>';document.getElementById('app').innerHTML=x}
function room(a){s.room=a;go('room')}function bed(a){s.bed=a;save();render()}function buy(a,p){if(s.owned.includes(a))return;if(s.gold<p)return alert('Du brauchst mehr Gold!');s.gold-=p;s.owned.push(a);save();render()}function element(a){s.element=a;save();render()}function nameDwarf(){s.name=document.getElementById('nm').value.trim();save();render()}function newWorld(){let t=document.getElementById('topic').value.trim();if(!t)return alert('Bitte Thema eingeben.');if(!s.worlds.includes(t))s.worlds.push(t);start(t)}function startWorld(i){start(s.worlds[i])}function start(t){s.topic=t;if(!/verdauung/i.test(t)){save();alert('Thema gespeichert! Für diese Testversion ist nur Verdauung spielbar.');go('portal');return}s.q=0;s.correct=0;feedback='';go('mission')}render();
document.addEventListener('click',function(ev){const el=ev.target.closest('button[data-action]');if(!el)return;const a=decodeURIComponent(el.dataset.action);let m;if((m=/^go\("([a-z]+)"\)$/.exec(a)))go(m[1]);else if((m=/^room\("([^\"]+)"\)$/.exec(a)))room(m[1]);else if((m=/^bed\("([^\"]+)"\)$/.exec(a)))bed(m[1]);else if((m=/^buy\("([^\"]+)",(\d+)\)$/.exec(a)))buy(m[1],Number(m[2]));else if((m=/^element\("([^\"]+)"\)$/.exec(a)))element(m[1]);else if((m=/^startWorld\((\d+)\)$/.exec(a)))startWorld(Number(m[1]));else if((m=/^answer\((\d+)\)$/.exec(a)))answer(Number(m[1]));else if(a==='nameDwarf()')nameDwarf();else if(a==='newWorld()')newWorld();});
</script></body></html>
